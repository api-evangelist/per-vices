note: >-
  Per Vices publishes no web API and no package-registry client libraries. Its
  first-party developer software is the UHD (USRP Hardware Driver) host stack, a
  GNU Radio out-of-tree block, and SoC firmware, all distributed as source from the
  pervices GitHub org and as Debian/apt packages built by pvpkg. Registry probes on
  2026-08-14 returned 404/403 for `pervices` on npm, PyPI, crates.io and RubyGems.
  The PyPI package `uhd` exists but belongs to Ettus Research / NI upstream, not to
  Per Vices, so it is NOT recorded here as first-party. Because there is no
  registry metadata endpoint for source-distributed software, `version:` and
  `published:` below are read from the repository's own git tag / GitHub release
  metadata (the provider-published, reliably-dated equivalent), and are null where
  the repo publishes no tag at all.
packages:
