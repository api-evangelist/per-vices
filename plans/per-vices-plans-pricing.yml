note: >-
  Per Vices sells software defined radio hardware, not API plans or subscriptions,
  and it is unusually transparent about it — it publishes list prices for every
  platform configuration on a public pricing page rather than hiding behind a
  "contact sales" wall. Captured verbatim from that page on 2026-08-14. There are
  no API tiers, no quotas, no overage, and no metered usage, because there is no
  hosted API to meter; the host software (UHD fork, GNU Radio blocks, examples,
  firmware) is published as open source at no additional charge. Host & Storage
  Solutions and custom channel counts are quoted individually.
