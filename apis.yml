name: Per Vices
description: >-
  Per Vices Corporation is a Toronto-based company that designs and manufactures
  high-performance software defined radio (SDR) platforms, where signal tuning is
  handled in hardware while the remaining radio functionality runs in software so a
  single application-agnostic platform can serve many markets. Its product line
  includes Cyan (up to 16 independent radio chains, near-DC to 18 GHz), Crimson TNG
  (4 Rx / 4 Tx, near-DC to 6 GHz), Chestnut (near-DC to 9 GHz on an Intel Stratix 10
  FPGA), and Calamine (receive-only, near-DC to 40 GHz). Per Vices ships open-source
  host software and firmware built on the UHD (USRP Hardware Driver) framework rather
  than a public web API; developers program the radios through the UHD C++ driver,
  GNU Radio integration, and example applications published on its GitHub org, with
  full integration support provided directly to customers. Added to the API Evangelist
  network as a portfolio-lead stub and enriched with company identity and a security
  probe; it publishes no public REST/OpenAPI web API surface.
