note: >-
  Per Vices publishes no rate limits, because it publishes no hosted API to rate
  limit. The only control interface is device-local (see
  conventions/per-vices-conventions.yml): an on-device web UI and socket.io channel
  on the SDR's management port, plus the UHD state tree, all reachable only from
  the customer's own network. Nothing in the support documentation, the pricing
  page, or the pervices/webserver source declares a request quota, a throttle, or
  a 429 response. The nearest analogue Per Vices does document is data-plane flow
  control — a hardware/protocol mechanism for IQ streaming, not an API rate limit —
  recorded below for context only.
