  - name: SDR data-plane flow control
    kind: hardware flow control (not an API rate limit)
    detail: >-
      Per Vices documents flow control on the SFP+ data plane (dedicated flow
      control UDP ports 42809 / 42810 on Crimson TNG) and publishes bandwidth and
      sample-rate calculations so an integrator can size the link. This governs IQ
      sample throughput between the radio and the host, not API requests.
